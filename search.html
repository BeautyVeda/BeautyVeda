<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search BeautyVeda for skincare, haircare, makeup, style and lifestyle articles.">
<meta name="robots" content="index,follow">
<title>Search | BeautyVeda</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
 <div class="wrap nav">
  <a class="logo" href="index.html"><img src="logo.svg" alt="BeautyVeda logo"><span>BeautyVeda</span></a>
  <nav class="navlinks" aria-label="Main navigation">
   <a href="index.html">Home</a>
   <a href="index.html#categories">Categories</a>
   <a class="active" href="search.html">Search</a>
   <a href="about.html">About</a>
   <a href="contact.html">Contact</a>
  </nav>
 </div>
</header>

<main>
<section class="search-hero">
 <div class="wrap">
  <p class="eyebrow">FIND YOUR NEXT READ</p>
  <h1>Search BeautyVeda</h1>
  <form class="searchbar" id="searchForm">
   <input id="q" type="search" autocomplete="off" placeholder="Try “hair fall”, “skincare”, “haircare”..." aria-label="Search BeautyVeda">
   <button id="go" type="submit">Search</button>
  </form>
  <p id="result" aria-live="polite"></p>
 </div>
</section>

<section class="wrap section">
 <div class="posts three" id="results"></div>
</section>
</main>

<footer>
 <div class="wrap foot">
  <a class="logo" href="index.html"><img src="logo.svg" alt=""><span>BeautyVeda</span></a>
  <p class="copy">© 2026 BeautyVeda</p>
 </div>
</footer>

<script>
/*
  BeautyVeda article index.
  Add each new article here so it appears in Search.
*/
const posts = [
  {
    category: "Haircare",
    title: "How to Reduce Hair Fall: 10 Simple Tips for Healthier Hair",
    url: "hair-fall-tips.html",
    cover: "cover2",
    description: "Practical, gentle habits that can help reduce avoidable breakage and support healthier-looking hair."
  },
  {
    category: "Skincare",
    title: "How to build a simple skincare routine you can actually follow",
    url: "post.html",
    cover: "cover1",
    description: "Start with the basics and create a routine that fits your real day."
  },
  {
    category: "Haircare",
    title: "Everyday habits for softer-looking, healthier hair",
    url: "post.html",
    cover: "cover2",
    description: "Simple changes that don't require a complicated routine."
  },
  {
    category: "Lifestyle",
    title: "7 tiny self-care habits for a calmer day",
    url: "post.html",
    cover: "cover3",
    description: "Small moments that can make your everyday routine feel better."
  },
  {
    category: "Makeup",
    title: "An easy everyday makeup routine for beginners",
    url: "post.html",
    cover: "cover1",
    description: "Simple makeup steps for a polished everyday look."
  },
  {
    category: "Style",
    title: "Simple style habits that make getting dressed easier",
    url: "post.html",
    cover: "cover2",
    description: "Easy ideas for building outfits with less effort."
  }
];

const box = document.getElementById("results");
const q = document.getElementById("q");
const out = document.getElementById("result");

function render(term = "") {
  const t = term.toLowerCase().trim();

  const list = posts.filter(p =>
    (p.category + " " + p.title + " " + p.description)
      .toLowerCase()
      .includes(t)
  );

  if (!list.length) {
    box.innerHTML = `
      <div style="grid-column:1/-1;padding:30px 0">
        <h2>No articles found</h2>
        <p>Try searching for <strong>hair fall</strong>, <strong>haircare</strong>,
        <strong>skincare</strong>, <strong>makeup</strong>, or <strong>lifestyle</strong>.</p>
      </div>`;
  } else {
    box.innerHTML = list.map(p => `
      <article class="post">
        <a href="${p.url}">
          <div class="cover ${p.cover}"><span>${p.category}</span></div>
          <div class="postcopy">
            <small>${p.category}</small>
            <h3>${p.title}</h3>
            <p>${p.description}</p>
            <b>Read article →</b>
          </div>
        </a>
      </article>
    `).join("");
  }

  out.textContent = list.length + " article" + (list.length === 1 ? "" : "s") + " found";
}

document.getElementById("searchForm").addEventListener("submit", function(e) {
  e.preventDefault();
  render(q.value);
});

q.addEventListener("input", function() {
  if (q.value.trim() === "") render("");
});

render("");
</script>

</body>
</html>
